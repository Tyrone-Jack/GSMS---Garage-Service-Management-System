<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - GSMS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo"><span>GS</span>GSMS</div>
                <h1 class="auth-title">Create Account</h1>
                <p class="auth-subtitle">Join GSMS for professional garage services</p>
            </div>

            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group"><label for="name">Full Name</label><input type="text" id="name" name="name" required placeholder="Enter your full name"></div>
                <div class="form-group"><label for="email">Email Address</label><input type="email" id="email" name="email" required placeholder="Enter your email"></div>
                <div class="form-group"><label for="password">Password</label><input type="password" id="password" name="password" required placeholder="Create a password (min. 6 characters)"></div>
                <div class="form-group"><label for="confirmPassword">Confirm Password</label><input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirm your password"></div>
                <div class="form-group"><label for="role">Register as</label><select id="role" name="role" required><option value="customer">Customer</option><option value="technician">Technician</option></select></div>
                <button type="submit" class="btn btn-primary btn-register">Create Account</button>
            </form>

            <div class="auth-footer"><p>Already have an account? <a href="login.html">Sign in here</a></p></div>
        </div>
    </div>
    <script src="data.js"></script>
    <script>
        const API_BASE_URL = 'http://localhost:3000';

        async function handleRegister(event) {
            event.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const role = document.getElementById('role').value;
            hideMessages();
            if (password !== confirmPassword) { showError('Passwords do not match'); return; }
            if (password.length < 6) { showError('Password must be at least 6 characters long'); return; }
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) { showError('Please enter a valid email address'); return; }
            try {
                const response = await fetch(`${API_BASE_URL}/api/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, role })
                });
                const data = await response.json();
                if (response.ok) {
                    showSuccess('Account created successfully! Redirecting to login...');
                    document.getElementById('registerForm').reset();
                    setTimeout(() => { window.location.href = 'login.html'; }, 2000);
                } else { showError(data.message || 'Registration failed. Please try again.'); }
            } catch (error) {
                console.error('Registration error:', error);
                showError('Unable to connect to server. Please make sure the server is running.');
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            setTimeout(() => { errorDiv.classList.remove('show'); }, 5000);
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.classList.add('show');
        }

        function hideMessages() {
            document.getElementById('errorMessage').classList.remove('show');
            document.getElementById('successMessage').classList.remove('show');
        }
    </script>
    <script src="toast.js"></script>
</body>
</html>
